<div class="pagina-auth">
  <div class="container animar-entrada">
    <div class="login-logo">
      <img
        src="assets/logo/logo.png"
        alt="Logo de la empresa"
        class="login-logo-img"
        [class.oculto]="!logoCargado"
        (load)="onLogoLoad()"
        (error)="onLogoError()"
      />
      <span class="login-logo-placeholder" *ngIf="!logoCargado">LOGO</span>
    </div>

    <h2>Iniciar sesion</h2>

    <p class="error" *ngIf="error">{{ error }}</p>

    <form (ngSubmit)="onSubmit()">
      <label>Email</label>
      <input type="email" name="email" [(ngModel)]="email" placeholder="tucorreo@ejemplo.com" />

      <label>Password</label>
      <input type="password" name="password" [(ngModel)]="password" placeholder="********" />

      <button type="submit" [disabled]="cargando">
        {{ cargando ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>

    <div class="separador-o" *ngIf="googleDisponible">
      <span>o</span>
    </div>

    <div class="google-btn-wrap" *ngIf="googleDisponible">
      <div #googleBtn></div>
    </div>

    <p class="auth-footer">¿No tienes cuenta? <a routerLink="/register">Registrate aqui</a></p>
  </div>
</div>
